compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

# Preserve the existing braces suppression by ID, not rate-limit-sensitive advisory text.
# GHSA-vfj7-8cjw-p6xm has no patched release; remove this once a fix is available.
npmAuditIgnoreAdvisories:
  - '1240992'

yarnPath: .yarn/releases/yarn-4.10.3.cjs

packageExtensions:
  '@angular-builders/jest@*':
    peerDependenciesMeta:
      '@angular/platform-browser-dynamic':
        optional: true
  'jest-preset-angular@*':
    peerDependenciesMeta:
      '@angular/platform-browser-dynamic':
        optional: true

npmScopes:
  appreg:
    npmRegistryServer: 'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/npm/registry/'
