compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

# Preserve the existing braces suppression by ID, not rate-limit-sensitive advisory text.
# GHSA-vfj7-8cjw-p6xm has no patched release; remove this once a fix is available.
# Azure Monitor and Application Insights still depend on these deprecated OpenTelemetry
# packages. Remove these four suppressions when Azure migrates to the replacement SDK.
npmAuditIgnoreAdvisories:
  - '1240992'
  - '@opentelemetry/propagator-jaeger (deprecation)'
  - '@opentelemetry/sdk-trace-base (deprecation)'
  - '@opentelemetry/sdk-trace-node (deprecation)'
  - '@opentelemetry/sdk-trace-web (deprecation)'

yarnPath: .yarn/releases/yarn-4.10.3.cjs

packageExtensions:
  '@angular-builders/jest@*':
    peerDependenciesMeta:
      '@angular/platform-browser-dynamic':
        optional: true
  'jest-preset-angular@*':
    peerDependenciesMeta:
      '@angular/platform-browser-dynamic':
        optional: true

npmScopes:
  appreg:
    npmRegistryServer: 'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/npm/registry/'
