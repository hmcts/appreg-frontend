<app-alert alertType="warning" [message]="warningBannerText" />

<app-review-confirm
  (confirm)="onDelete()"
  (cancelled)="goBack()"
  confirmButtonTxt="Confirm"
  [title]="title"
>
  <app-table [rows]="[listToDelete]" [columns]="columns">
    <ng-template #dateTemplate let-row>
      {{ row.date | dateTime }}
    </ng-template>
  </app-table>
</app-review-confirm>
