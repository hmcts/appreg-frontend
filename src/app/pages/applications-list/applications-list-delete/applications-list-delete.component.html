<app-alert
  alertType="warning"
  message="You are about to delete this application list and all of the application list entries. This action cannot be undone."
/>

<app-review-confirm
  (confirm)="onDelete()"
  (cancelled)="goBack()"
  confirmButtonTxt="Yes - delete"
  title="Are you sure you want to delete this application list?"
  [disabled]="
    !entriesLoaded() || entriesLoading() || entriesLoadError() || deleting()
  "
>
  @if (entriesLoadError()) {
    <app-error-summary
      [items]="[
        {
          text: 'Could not load all application list entries. Try again before deleting the list.',
          href: '#retry-entries',
        },
      ]"
    />
    <button
      id="retry-entries"
      type="button"
      class="govuk-button govuk-button--secondary"
      (click)="loadChildEntries()"
    >
      Try again
    </button>
  }
  <p class="govuk-body" role="status">
    @if (entriesLoading()) {
      Loading application list entries…
    } @else if (entriesLoaded() && childEntries().length === 0) {
      This application list has no entries.
    }
  </p>
  <app-table [rows]="[listToDelete]" [columns]="columns">
    <ng-template #dateTemplate let-row>
      {{ row.date | dateTime }}
    </ng-template>
  </app-table>
</app-review-confirm>
