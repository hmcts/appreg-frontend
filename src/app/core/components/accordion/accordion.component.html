<div
  #root
  class="govuk-accordion"
  data-module="govuk-accordion"
  [attr.data-remember-expanded]="rememberExpanded() ? null : 'false'"
  [id]="id()"
>
  @for (item of displayItems(); track $index; let i = $index) {
    <div
      class="govuk-accordion__section"
      [class.govuk-accordion__section--expanded]="item.expanded"
    >
      <div class="govuk-accordion__section-header">
        <h2 class="govuk-accordion__section-heading">
          <button
            type="button"
            class="govuk-accordion__section-button"
            [id]="headingId(i)"
            [attr.aria-controls]="panelId(i)"
            [attr.aria-expanded]="item.expanded ? 'true' : 'false'"
            (click)="toggle(i); $event.stopPropagation()"
          >
            {{ item.heading }}
          </button>
        </h2>
      </div>

      <section
        class="govuk-accordion__section-content"
        [id]="panelId(i)"
        [attr.aria-labelledby]="headingId(i)"
        [hidden]="!item.expanded"
      >
        @if (item.tpl) {
          <ng-container [ngTemplateOutlet]="item.tpl"></ng-container>
        } @else {
          @if (item.content) {
            <p class="govuk-body">{{ item.content }}</p>
          }
        }
      </section>
    </div>
  }
</div>
