<div [class]="containerWidthClass()">
  <div class="govuk-form-group" [class.govuk-form-group--error]="isInvalid()">
    @if (label().length) {
      <label class="govuk-label" [for]="id()">{{ label() }}</label>
    }

    @if (isInvalid() && errorMessage()) {
      <p [id]="errorId" class="govuk-error-message">
        <span class="govuk-visually-hidden">Error:</span>
        {{ errorMessage() }}
      </p>
    }

    <textarea
      class="govuk-textarea"
      [id]="id()"
      [name]="name()"
      [rows]="rows()"
      [attr.aria-describedby]="describedBy"
      [attr.aria-invalid]="isInvalid() ? 'true' : null"
      [formControl]="control()"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      [maxlength]="maxCharacterLimit()"
      [class.govuk-textarea--error]="isInvalid()"
    ></textarea>

    @if (characterCountEnabled()) {
      <div [id]="id() + '-hint'" class="govuk-visually-hidden">
        You can enter up to {{ maxCharacterLimit() }} characters.
      </div>
      <div class="govuk-hint" aria-hidden="true">
        {{ charLimitText }}
      </div>
      <div
        class="govuk-visually-hidden"
        [attr.aria-live]="isFocused() ? 'polite' : 'off'"
        aria-atomic="true"
      >
        {{ announcedCount() }}
      </div>
    }
  </div>
</div>
