<section
  aria-label="Service information"
  class="govuk-service-navigation"
  data-module="govuk-service-navigation"
>
  <div class="govuk-width-container">
    <div class="govuk-service-navigation__container">
      <span class="govuk-service-navigation__service-name">
        <a>Applications register</a>
      </span>
      <nav
        [hidden]="!showMenu()"
        aria-label="Menu"
        class="govuk-service-navigation__wrapper"
      >
        <ul class="govuk-service-navigation__list" id="navigation">
          <li
            class="govuk-service-navigation__item"
            routerLinkActive="govuk-service-navigation__item--active"
            [routerLinkActiveOptions]="{ exact: false }"
            #listSection="routerLinkActive"
          >
            <a
              routerLink="/applications-list"
              class="govuk-service-navigation__link"
              routerLinkActive
              #listPage="routerLinkActive"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                fragment: 'ignored',
                matrixParams: 'ignored',
              }"
              [attr.aria-current]="
                listPage.isActive
                  ? 'page'
                  : listSection.isActive
                    ? 'true'
                    : null
              "
            >
              Applications list
            </a>
          </li>
          <li
            class="govuk-service-navigation__item"
            routerLinkActive="govuk-service-navigation__item--active"
            [routerLinkActiveOptions]="{ exact: false }"
            #applicationsSection="routerLinkActive"
          >
            <a
              routerLink="/applications"
              class="govuk-service-navigation__link"
              routerLinkActive
              #rlaApp="routerLinkActive"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                fragment: 'ignored',
                matrixParams: 'ignored',
              }"
              [attr.aria-current]="
                rlaApp.isActive
                  ? 'page'
                  : applicationsSection.isActive
                    ? 'true'
                    : null
              "
            >
              Applications
            </a>
          </li>
          <li
            class="govuk-service-navigation__item"
            routerLinkActive="govuk-service-navigation__item--active"
            [routerLinkActiveOptions]="{ exact: false }"
            #applicantsSection="routerLinkActive"
          >
            <a
              routerLink="/standard-applicants"
              class="govuk-service-navigation__link"
              routerLinkActive
              #applicantsPage="routerLinkActive"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                fragment: 'ignored',
                matrixParams: 'ignored',
              }"
              [attr.aria-current]="
                applicantsPage.isActive
                  ? 'page'
                  : applicantsSection.isActive
                    ? 'true'
                    : null
              "
            >
              Standard applicants
            </a>
          </li>
          <li
            class="govuk-service-navigation__item"
            routerLinkActive="govuk-service-navigation__item--active"
            [routerLinkActiveOptions]="{
              paths: 'exact',
              queryParams: 'ignored',
              fragment: 'ignored',
              matrixParams: 'ignored',
            }"
          >
            <a
              routerLink="/reports"
              class="govuk-service-navigation__link"
              routerLinkActive
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                fragment: 'ignored',
                matrixParams: 'ignored',
              }"
            >
              Reports
            </a>
          </li>
          <li
            class="govuk-service-navigation__item"
            routerLinkActive="govuk-service-navigation__item--active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <form action="/sso/logout" method="post">
              <input type="hidden" name="_csrf" [value]="xsrfToken()" />
              <button
                type="submit"
                class="govuk-service-navigation__link app-service-navigation__button"
              >
                Sign out
              </button>
            </form>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</section>
