<div [formGroup]="form">
  <p class="govuk-body wording-parser-text">
    @for (t of tokens; track $index) {
      @if (t.type == 'text') {
        {{ t.value }}&nbsp;
      } @else if (t.type == 'input') {
        <input
          [id]="normaliseKey(t.key)"
          class="govuk-input"
          [ngClass]="getInputWidthClass(t.key)"
          [attr.aria-label]="'Enter ' + t.key"
          [class.govuk-input--error]="
            form.get(normaliseKey(t.key))?.invalid && submitted()
          "
          [formControlName]="normaliseKey(t.key)"
          type="text"
          (keydown.enter)="onWordingEnter($event)"
          [placeholder]="'Enter a ' + t.key"
        />&nbsp;
      }
    }
  </p>
  @if (hasWordingInput() && showSaveButton()) {
    <button
      type="button"
      id="save-wording-button"
      class="govuk-button"
      data-module="govuk-button"
      (click)="submitWordingFields()"
    >
      Apply wording
    </button>
  }
</div>
