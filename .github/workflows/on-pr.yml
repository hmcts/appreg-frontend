name: PR Tasks

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  add-redirect-uris:
    if: ${{ !startsWith(github.head_ref, 'codex/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Queues this PR's runs here and in close-pr.yml in event order, so a close
    # never overlaps an add that is still checking its callbacks. Runs for
    # different PRs still overlap; the sync script handles that.
    concurrency:
      group: preview-redirect-uris-pr-${{ github.event.number }}
      cancel-in-progress: false

    steps:
      - name: Check required secrets are present
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" || (echo "Missing AZURE_CLIENT_ID" && exit 1)
          test -n "${{ secrets.AZURE_CLIENT_SECRET }}" || (echo "Missing AZURE_CLIENT_SECRET" && exit 1)
          test -n "${{ secrets.AZURE_TENANT_ID }}" || (echo "Missing AZURE_TENANT_ID" && exit 1)
          test -n "${{ secrets.APPREG_OBJECT_ID }}" || (echo "Missing APPREG_OBJECT_ID" && exit 1)

      - name: Check out the redirect URI script
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}" \
            --allow-no-subscriptions

      - name: Add redirect URIs for PR environment
        env:
          PR_NUMBER: ${{ github.event.number }}
          OBJECT_ID: ${{ secrets.APPREG_OBJECT_ID }}
          # Every update also carries the other open PRs' callbacks.
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: OPEN_PRS="[${PR_NUMBER}]" .github/scripts/sync-preview-redirect-uris.sh
