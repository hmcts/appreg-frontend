name: Codex preview redirect URIs

# on-pr.yml and close-pr.yml skip codex/ branches: a pull request runs the
# branch's own copy of those workflows, and they hold the app-registration
# credentials. This workflow does their job for Codex PRs instead. It runs only
# from master, on a schedule or by hand, and never checks out or runs PR code.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-preview-redirects
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Find Codex PRs
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh pr list --repo "${GITHUB_REPOSITORY}" --state all --search 'head:codex/' --limit 100 \
            --json number,state,headRefName,isCrossRepository,closedAt \
            | jq -c '[.[] | select((.headRefName | startswith("codex/")) and (.isCrossRepository | not))]' \
            >"${RUNNER_TEMP}/codex-prs.json"

          since="$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)"
          open="$(jq -c '[.[] | select(.state == "OPEN") | .number]' "${RUNNER_TEMP}/codex-prs.json")"
          closed="$(jq -c '[.[] | select(.state != "OPEN") | .number]' "${RUNNER_TEMP}/codex-prs.json")"
          recently_closed="$(jq -c --arg since "${since}" '[.[] | select(.state != "OPEN" and (.closedAt // "") >= $since) | .number]' "${RUNNER_TEMP}/codex-prs.json")"

          echo "Open Codex PRs: ${open}"
          echo "Codex PRs closed in the last day: ${recently_closed}"
          {
            echo "open=${open}"
            echo "closed=${closed}"
          } >>"${GITHUB_OUTPUT}"

          # Skip the Azure sign-in when a scheduled run has nothing to do.
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" && "${open}" == "[]" && "${recently_closed}" == "[]" ]]; then
            echo "reconcile=false" >>"${GITHUB_OUTPUT}"
          else
            echo "reconcile=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Azure Login
        if: steps.prs.outputs.reconcile == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            test -n "${!name}" || { echo "Missing ${name}"; exit 1; }
          done
          az login --service-principal \
            --username "${AZURE_CLIENT_ID}" \
            --password "${AZURE_CLIENT_SECRET}" \
            --tenant "${AZURE_TENANT_ID}" \
            --allow-no-subscriptions \
            --output none

      - name: Reconcile redirect URIs
        if: steps.prs.outputs.reconcile == 'true'
        env:
          OBJECT_ID: ${{ secrets.APPREG_OBJECT_ID }}
          OPEN_PRS: ${{ steps.prs.outputs.open }}
          CLOSED_PRS: ${{ steps.prs.outputs.closed }}
        run: |
          set -euo pipefail
          test -n "${OBJECT_ID}" || { echo "Missing APPREG_OBJECT_ID"; exit 1; }

          callbacks() {
            jq -c '[.[] | "https://appreg-frontend-pr-\(.).dev.platform.hmcts.net/sso/login-callback",
                          "https://appreg-frontend-pr-\(.).dev.platform.hmcts.net/sso/logout-callback"]' <<<"$1"
          }
          add="$(callbacks "${OPEN_PRS}")"
          remove="$(callbacks "${CLOSED_PRS}")"

          current="$(az rest \
            --method GET \
            --url "https://graph.microsoft.com/v1.0/applications/${OBJECT_ID}" \
            --query "web.redirectUris" -o json --only-show-errors)"
          if [ "${current}" = "null" ] || [ -z "${current}" ]; then
            current="[]"
          fi
          current="$(jq -c . <<<"${current}")"

          # Only ever remove the callbacks of closed Codex PRs.
          updated="$(jq -c --argjson add "${add}" --argjson remove "${remove}" '(. - $remove) + ($add - .)' <<<"${current}")"

          if [ "${updated}" = "${current}" ]; then
            echo "Redirect URIs already match the open Codex PRs."
            exit 0
          fi

          jq -r --argjson before "${current}" '"Adding: " + ((. - $before) | join(", ")), "Removing: " + (($before - .) | join(", "))' <<<"${updated}"

          az rest \
            --method PATCH \
            --url "https://graph.microsoft.com/v1.0/applications/${OBJECT_ID}" \
            --headers "Content-Type=application/json" \
            --body "$(jq -cn --argjson uris "${updated}" '{web:{redirectUris:$uris}}')" \
            --only-show-errors
          echo "Redirect URIs updated."
