name: CI Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
      - run: corepack enable && yarn --version
      - name: Validate Codex workflow scripts
        run: ./bin/codex-local-pipeline.sh checks-only --no-fetch
      - run: yarn install
      - run: yarn cichecks
